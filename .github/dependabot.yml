version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "backend"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "frontend"]

  - package-ecosystem: "npm"
    directory: "/admin"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "admin"]

  - package-ecosystem: "docker"
    directories: ["/backend", "/frontend", "/admin", "/nginx"]
    schedule:
      interval: "weekly"
    labels: ["dependencies", "infra"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci-cd"]
